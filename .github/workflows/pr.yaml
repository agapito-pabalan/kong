# This file is copied from stordco/common-config-elixir.

name: PR

on:
  merge_group:
  pull_request:
    types:
      - edited
      - opened
      - reopened
      - synchronize

concurrency:
  group: pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  pull-requests: read

jobs:
  title:
    if: github.event_name == 'pull_request'
    name: Check Title
    runs-on: ubuntu-latest

    steps:
      - name: Check
        uses: stordco/actions-pr-title@173b9bf1fb825f6acf05a499ec3674911d257ac6 # v1.0.0
        with:
          regex: '^(feat!|fix!|fix|feat|chore|(fix|feat|chore)\(\w.*\)):\s(\[\w{1,8}-\d{1,8}\]|.*).*'
          hint: |
            You can pass the following formats:
            fix: [OR-123] some title of the PR
            feat: [OR-1234] some title of the PR
            chore: update some action
            Note: Adding ! (i.e. `feat!:`) represents a breaking change and will result in a SemVer major.
