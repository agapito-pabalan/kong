name: Development

on:
  repository_dispatch:
    types:
      - development-elixir-deploy
  workflow_dispatch:
    inputs:
      name:
        default: ""
        description: "Name of the ephemeral environment"
        required: false
        type: string
      deployment_size:
        default: small
        description: "The amount of resources allocated"
        options:
          - small
          - medium
          - large
        required: true
        type: choice
      expiration_hours:
        default: 12
        description: "Destroy time in hours"
        required: true
        type: number

concurrency:
  group: development-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  Infrastructure:
    runs-on: ubuntu-latest

    outputs:
      name: ${{ steps.setup.outputs.name }}

    permissions:
      contents: read
      id-token: write
      packages: read

    steps:
      - id: setup
        name: Setup
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const cleanName = (context?.payload?.client_payload?.name || context.ref)
              .replace('refs/heads/', '')
              .replace(/[^a-z0-9\-]+/i, '-')
              .replace(/-{2,}/, '-')
              .substring(0, 28)
              .replace(/^(-+)/, '')
              .replace(/(-+)$/, '')
              .toLowerCase()

            if (cleanName === "") {
              core.setFailed('Unable to determine clean name. Failing early.')
            } else {
              core.info(`Clean name is set to ${cleanName}`)
            }

            const expirationDate = new Date()
            expirationDate.setHours(expirationDate.getHours() + Number(context?.payload?.inputs?.expiration_hours || 12))
            const expirationString = expirationDate.toISOString()

            core.info(`Environment will automatically be destroyed at ${expirationString}`)

            core.setOutput('name', cleanName)
            core.setOutput('expiration_timestamp', expirationString)

      - if: ${{ github.event_name == 'workflow_dispatch' }}
        name: Generate Token
        id: reader-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.READER_APP_ID }}
          private-key: ${{ secrets.READER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - if: ${{ github.event_name == 'workflow_dispatch' }}
        name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          repository: stordco/infrastructure
          token: ${{ steps.reader-token.outputs.token }}

      - if: ${{ github.event_name == 'workflow_dispatch' }}
        name: Login (GCP)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          service_account: github@stord-development.iam.gserviceaccount.com
          workload_identity_provider: projects/168613326032/locations/global/workloadIdentityPools/github/providers/github

      - if: ${{ github.event_name == 'workflow_dispatch' }}
        name: Setup (gcloud)
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - if: ${{ github.event_name == 'workflow_dispatch' }}
        name: Setup
        uses: ./.github/actions/setup-workspace
        with:
          gh-token: ${{ steps.reader-token.outputs.token }}
          tf-token: ${{ secrets.TFE_TOKEN }}

      - if: ${{ github.event_name == 'workflow_dispatch' }}
        name: Load secret
        uses: 1password/load-secrets-action@92467eb28f72e8255933372f1e0707c567ce2259 # v4.0.0
        env:
          CLICKHOUSE_ORG_ID: "op://CI/ClickHouse/Organization ID"
          CLICKHOUSE_TOKEN_KEY: "op://CI/ClickHouse/Token Key"
          CLICKHOUSE_TOKEN_SECRET: "op://CI/ClickHouse/Token Secret"
          CONFLUENT_CLOUD_API_KEY: "op://CI/Confluent Cloud/username"
          CONFLUENT_CLOUD_API_SECRET: "op://CI/Confluent Cloud/credential"
          EC_API_KEY: "op://CI/Elastic Cloud API Key/credential"
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - if: ${{ github.event_name == 'workflow_dispatch' }}
        name: Init
        run: terraform init -input=false
        working-directory: terraform/projects/stord-development/99-ephemeral-environments
        env:
          GITHUB_TOKEN: ${{ steps.reader-token.outputs.token }}

      - if: ${{ github.event_name == 'workflow_dispatch' }}
        name: Apply
        run: |
          terraform apply -auto-approve -input=false -lock-timeout=30s -target=module.stord_ephemeral_environment.confluent_role_binding.this
          terraform apply -auto-approve -input=false -lock-timeout=30s
        working-directory: terraform/projects/stord-development/99-ephemeral-environments
        env:
          GITHUB_TOKEN: ${{ steps.reader-token.outputs.token }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TF_VAR_deployment_size: ${{ inputs.deployment_size }}
          TF_VAR_expiration_timestamp: ${{ steps.setup.outputs.expiration_timestamp }}
          TF_VAR_name: ${{ steps.setup.outputs.name }}
          TF_WORKSPACE: ${{ steps.setup.outputs.name }}

  Dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [Infrastructure]

    runs-on: ubuntu-latest

    steps:
      - name: Generate Token
        id: release-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write

      - name: Dispatch Other Repositories
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ steps.release-token.outputs.token }}
          script: |
            const { data } = await github.rest.search.code({
              q: 'development-elixir-deploy org:stordco path:.github/workflows/',
              per_page: 100,
            })

            const repositories = data.items
              .map((i) => i.repository)
              .filter((repo) => {
                return repo.full_name !== context.payload.repository.full_name;
              })
              .filter((repo, index, list) => {
                return list.findIndex((r) => r.id === repo.id) === index;
              });

            core.info(`Found ${repositories.length} repositories`);

            for (const repository of repositories) {
              core.info(`Dispatching development workflow for ${repository.full_name}`);

              await github.rest.repos.createDispatchEvent({
                owner: repository.owner.login,
                repo: repository.name,
                event_type: 'development-elixir-deploy',
                client_payload: {
                  name: "${{ needs.Infrastructure.outputs.name }}"
                }
              });
            }

  Docker:
    needs: [Infrastructure]

    outputs:
      image: ${{ steps.build.outputs.image }}
      tag: ${{ steps.build.outputs.tag }}

    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate Token
        id: reader-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.READER_APP_ID }}
          private-key: ${{ secrets.READER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - id: gcp
        name: Login (GCP)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          service_account: github@stord-ci.iam.gserviceaccount.com
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Login (GCR)
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: gcr.io
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}

      - id: build
        name: Build
        uses: stordco/actions-elixir/docker-build@e125c9eecde83437728201927fd1d7516cb6cee7 # v1.5.4
        with:
          github-token: ${{ steps.reader-token.outputs.token }}
          images: gcr.io/stord-ci/kong
          push: true

  Kubernetes:
    environment:
      name: Development
      url: "https://kong-${{ needs.Infrastructure.outputs.name }}.stord.dev"

    name: Kubernetes (${{ matrix.cluster }}/${{ matrix.namespace }})

    needs: [Infrastructure, Docker]

    permissions:
      contents: read
      id-token: write
      packages: read

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: gcp
        name: Login (GCP)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          service_account: ${{ format('github@{0}.iam.gserviceaccount.com', matrix.project) }}
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Connect (Twingate)
        if: vars.TWINGATE_ENABLED != 'false'
        uses: Twingate/github-action@f1e69fc5af67b737d8597b759e5c607f567e77f2 # v1.8
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      - name: Install (Gcloud)
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: "gke-gcloud-auth-plugin"

      - name: Login (Kubernetes Cluster)
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: ${{ matrix.cluster }}
          location: ${{ matrix.region }}
          project_id: ${{ matrix.project }}

      - name: Login (GHCR)
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u stordco --password-stdin

      - name: Helm Upgrade
        uses: stordco/actions-helm@890d7c6d764509bed9565625d5ce3523d4804a80 # v0.1.7
        with:
          args: >-
            --atomic
            --cleanup-on-fail
            --install
            --timeout 1200s
            --version ~>5
            --wait
          chart: oci://ghcr.io/stordco/helm/stord-application
          cluster: ${{ matrix.cluster }}
          command: upgrade
          name: kong
          namespace: ${{ matrix.namespace }}
          values_files: >-
            helm/${{ matrix.project }}.yaml
            helm/${{ matrix.namespace }}.yaml
          values_inline: |
            appVersion: '${{ needs.Docker.outputs.tag }}'
            environment:
              API_HOST: 'https://kong-${{ needs.Infrastructure.outputs.name }}.stord.dev'
            image:
              tag: '${{ needs.Docker.outputs.tag }}'
              repository: '${{ needs.Docker.outputs.image }}'
            nameOverride: 'kong'
            networking:
              route:
                hostnames: ['kong-${{ needs.Infrastructure.outputs.name }}.stord.dev']
            observability:
              commit: "${{ github.sha }}"
              version: "${{ needs.Docker.outputs.tag }}"

    strategy:
      matrix:
        include:
          - cluster: us-east1-dev-ephemeral-v1
            namespace: ${{ needs.Infrastructure.outputs.name }}
            project: stord-development
            region: us-east1
