# This file is copied from stordco/common-config-elixir.

name: Production

on:
  release:
    types:
      - released
      - prereleased
  workflow_dispatch:
    inputs:
      twingate_disabled:
        default: false
        description: "Disable Twingate connection"
        required: false
        type: boolean

concurrency:
  group: Production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  Docker:
    outputs:
      image: ${{ steps.build.outputs.image }}
      tag: ${{ steps.build.outputs.tag }}

    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate Token
        id: reader-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.READER_APP_ID }}
          private-key: ${{ secrets.READER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - id: gcp
        name: Login (GCP)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          service_account: github@stord-ci.iam.gserviceaccount.com
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Login (GCR)
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: gcr.io
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}

      - id: build
        name: Build
        uses: stordco/actions-elixir/docker-build@e125c9eecde83437728201927fd1d7516cb6cee7 # v1.5.4
        with:
          github-token: ${{ steps.reader-token.outputs.token }}
          images: gcr.io/stord-ci/kong
          push: true

  Kubernetes:
    environment:
      name: Production

    name: Kubernetes (${{ matrix.cluster }})

    needs: [Docker]

    permissions:
      contents: read
      id-token: write
      packages: read

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set Helm Release Name and Chart Values
        id: helm-metadata
        env:
          HELM_RELEASE_NAME: ${{ matrix.helm_release_name }}
          HELM_CHART_VALUES: ${{ matrix.helm_chart_values }}
          PROJECT: ${{ matrix.project }}
        run: |
          if [ -z "$HELM_RELEASE_NAME" ]; then
            RELEASE_NAME=kong
            echo "helm-release-name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "helm-release-name=$HELM_RELEASE_NAME" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$HELM_CHART_VALUES" ]; then
            echo "helm-chart-values=$PROJECT" >> "$GITHUB_OUTPUT"
          else
            echo "helm-chart-values=$HELM_CHART_VALUES" >> "$GITHUB_OUTPUT"
          fi

      - id: gcp
        name: Login (GCP)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          service_account: ${{ format('github@{0}.iam.gserviceaccount.com', matrix.project) }}
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Connect (Twingate)
        if: ${{ vars.TWINGATE_ENABLED != 'false' && !inputs.twingate_disabled }}
        uses: Twingate/github-action@f1e69fc5af67b737d8597b759e5c607f567e77f2 # v1.8
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      - name: Install (Gcloud)
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: "gke-gcloud-auth-plugin"

      - name: Login (Kubernetes Cluster)
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: ${{ matrix.cluster }}
          location: ${{ matrix.region }}
          project_id: ${{ matrix.project }}

      - name: Login (GHCR)
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u stordco --password-stdin

      - name: Helm Upgrade (${{ steps.helm-metadata.outputs.helm-release-name }})
        id: helm-upgrade
        uses: stordco/actions-helm@890d7c6d764509bed9565625d5ce3523d4804a80 # v0.1.7
        with:
          args: >-
            --atomic
            --cleanup-on-fail
            --install
            --timeout 600s
            --version ~>5
            --wait
          chart: oci://ghcr.io/stordco/helm/stord-application
          cluster: ${{ matrix.cluster }}
          command: upgrade
          name: ${{ steps.helm-metadata.outputs.helm-release-name }}
          namespace: ${{ matrix.namespace }}
          values_files: >-
            helm/${{ matrix.project }}.yaml
            helm/${{ steps.helm-metadata.outputs.helm-chart-values }}.yaml
            helm/${{ matrix.namespace }}.yaml
          values_inline: |
            appVersion: '${{ needs.Docker.outputs.tag }}'
            image:
              tag: '${{ needs.Docker.outputs.tag }}'
              repository: '${{ needs.Docker.outputs.image }}'
            nameOverride: '${{ steps.helm-metadata.outputs.helm-release-name }}'
            observability:
              commit: "${{ github.sha }}"
              version: "${{ needs.Docker.outputs.tag }}"

      - name: Send Helm upgrade failure notification
        if: ${{ failure() && steps.helm-upgrade.conclusion == 'failure' }}
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "C07485L8ZHD"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: ":alert: *Helm upgrade failed* on release `${{ steps.helm-metadata.outputs.helm-release-name }}` in `Production`."
              - type: section
                fields:
                  - type: mrkdwn
                    text: "*Repository:*\n`${{ github.repository }}`"
                  - type: mrkdwn
                    text: "*Release Tag:*\n`${{ github.event.release.tag_name }}`"
              - type: section
                text:
                  type: mrkdwn
                  text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"

    strategy:
      matrix:
        include: ${{ fromJSON(vars.OMS_PRODUCTION_GKE) }}
