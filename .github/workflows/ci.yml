---
name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - "main"

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  Build:
    defaults:
      run:
        shell: bash

    name: Build ${{ matrix.combos.file }}

    permissions:
      contents: read
      id-token: write
      packages: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login (GCP)
        uses: google-github-actions/auth@v2
        with:
          service_account: github@${{ matrix.combos.project }}.iam.gserviceaccount.com
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Install (Gcloud)
        uses: google-github-actions/setup-gcloud@v2

      - name: Login (GCR)
        run: gcloud auth configure-docker

      - id: meta
        name: Metadata
        uses: docker/metadata-action@v3
        with:
          images: gcr.io/${{ matrix.combos.project }}/${{ matrix.combos.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - id: export
        name: Export
        uses: actions/github-script@v6
        with:
          script: |
            const metadata = JSON.parse(`${{ steps.meta.outputs.json }}`)
            const fullUrl = metadata.tags.find((t) => t.includes(':sha-'))
            if (fullUrl == null) {
              core.error('Unable to find sha tag of image')
            } else {
              const tag = fullUrl.split(':')[1]
              core.setOutput('image', fullUrl)
              core.setOutput('tag', tag)
            }

      - name: Build
        run: |
          docker-compose -f docker-compose.${{ matrix.combos.file }}.yml build

      - if: matrix.combos.file == 'local'
        name: Check
        run: |
          check=$(
            docker-compose -f docker-compose.${{ matrix.combos.file }}.yml run \
              -e KONG_DATABASE=off \
              -e KONG_DECLARATIVE_CONFIG=/usr/local/share/kong.yml \
              -e KONG_PLUGINS=user_management_bridge,cors,request-size-limiting,prometheus,correlation-id \
              -e KONG_PLUGINSERVER_NAMES=user_management_bridge \
              -e KONG_PLUGINSERVER_USER_MANAGEMENT_BRIDGE_START_CMD=/usr/local/bin/user_management_bridge \
              -e KONG_PLUGINSERVER_USER_MANAGEMENT_BRIDGE_QUERY_CMD='/usr/local/bin/user_management_bridge -dump' \
              --rm kong \
              kong config parse /usr/local/share/kong.yml
          )
          if ! [[ "$check" =~ "parse successful" ]]; then exit 1; fi

      - env:
          DOCKER_IMAGES: ${{ steps.meta.outputs.tags }}
        name: Tag
        run: |
          for img in $DOCKER_IMAGES; do
            echo "Tagging kong with $img"
            docker tag stordco/kong $img
          done

    strategy:
      fail-fast: false
      matrix:
        combos:
          - file: local
            project: stord-nonprod
            image: kong-local
          - file: nonprod
            project: stord-nonprod
            image: kong
          - file: prod
            project: stord-production
            image: kong
          - file: dev
            project: stord-nonprod
            image: kong

  Lint:
    container:
      image: kong:2.2.1-alpine
      options: --user root

    defaults:
      run:
        shell: bash

    env:
      KONG_DATABASE: "off"

    runs-on: ubuntu-latest

    steps:
      - name: Install (Git)
        run: |
          apk update && apk add --no-cache bash git

      - name: Checkout
        uses: actions/checkout@v3

      - name: Check
        run: |
          check=$(kong config parse kong.conf.d/kong.services.yml)
          if [ "$check" != "parse successful" ]; then exit 1; fi
