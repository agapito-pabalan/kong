image:
  repository: gcr.io/stord-nonprod/kong
  tag: ${DOCKER_IMAGE_TAG}

serviceMonitor:
  enabled: false

ingressController:
  enable: false
  installCRDs: false

env:
  database: "off"
  plugins: bellatrix_bridge,cors,request-size-limiting,prometheus
  go_plugins_dir: /usr/local/share/go-plugins

dblessConfig:
  config:
    _format_version: "1.1"
    services:
      - name: saiph
        url: http://saiph
        routes:
          - name: saiph_root
            strip_path: false
            paths:
              - /addresses
              - /companies
              - /countries
              - /countries/([^\/]+)/subdivisions
              - /distribution_networks
              - /distribution_networks/([^\/]+)/items
              - /distribution_networks/([^\/]+)/items_search
              - /health/saiph
              - /item_unit_conversions
              - /items
              - /items/([^\/]+)/item_unit_conversions
              - /items_lookup
              - /trade_connections
              - /warehouses
              - /warehouses/([^\/]+)
              - /warehouses/([^\/]+)/distribution_networks
              - /warehouses/([^\/]+)/trade_connections

admin:
  enabled: true
  useTLS: false