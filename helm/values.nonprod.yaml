image:
  repository: gcr.io/stord-nonprod/kong
  tag: ${DOCKER_IMAGE_TAG}
  pullSecrets:
   - gcr-access-key

serviceMonitor:
  enabled: true

ingressController:
  enabled: false
  installCRDs: false

migrations:
  preUpgrade: false
  postUpgrade: false
runMigrations: false

postgresql:
  enabled: false

env:
  database: "off"
  plugins: user_management_bridge,cors,request-size-limiting,correlation-id,zipkin
  go_plugins_dir: /usr/local/share/go-plugins
  declarative_config: /usr/local/share/kong.yml
  nginx_proxy_client_body_buffer_size: "32M"
  nginx_proxy_large_client_header_buffers: "16 16k"
  nginx_proxy_client_header_buffer_size: "16k"
  nginx_http_client_max_body_size: 0
  nginx_http_proxy_buffer_size: "32M"
  nginx_http_proxy_buffers: "16 32M"
  datadog_agent_host:
    valueFrom:
      fieldRef:
        fieldPath: status.hostIP

admin:
  enabled: true
  useTLS: false
  tls:
    enabled: false
  http:
    enabled: true

proxy:
  enabled: true
  useTLS: false
  tls:
    enabled: false
  http:
    enabled: true
  type: ClusterIP

podLabels:
  tags.datadoghq.com/env: staging
  tags.datadoghq.com/service: kong
  tags.datadoghq.com/version: <VERSION>

autoscaling:
  enabled: true
  minRepicas: 4
  maxReplicas: 4
