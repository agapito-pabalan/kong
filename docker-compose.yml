version: "3.7"
services:
  kong:
    build: .
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/share/config.yml
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_PLUGINS=bellatrix_bridge,cors,request-size-limiting
      - KONG_GO_PLUGINS_DIR=/usr/local/share/go-plugins
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_LOG_LEVEL=info
    ports:
      - "8000:8000/tcp"
      - "8001:8001/tcp"