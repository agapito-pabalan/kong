version: 2.1

jobs:
  build:
    docker:
      - image: docker/compose:latest
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - checkout
      - run:
          name: Build Image
          command: docker-compose -f docker-compose.yml -f docker-compose.ci.yml build
      - run:
          name: Store Image In CircleCI
          command: docker save -o /tmp/kong-latest gcr.io/stord-nonprod/kong:${CIRCLE_WORKFLOW_ID}
  push-to-gcr:
    docker:
      - image: docker/compose:latest
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - checkout
      - run:
          name: Authenticate with GCR
          command: echo $NONPROD_GCLOUD_SERVICE_KEY | docker login -u _json_key --password-stdin https://gcr.io
      - run:
          name: Push to GCR
          command: docker-compose -f docker-compose.yml -f docker-compose.ci.yml push
  # promote:
  #   steps:
  #     - setup_remote_docker:
  #         docker_layer_caching: false
  #     - run:
  #         name: Checkout
  #         command: checkout
  #     - run:
  #         name: Promote Backend
  #         command: ./.circleci/bin/promote <<pipeline.git.tag>>
workflows:
  version: 2
  build_and_release:
    jobs:
      - build
      - push-to-gcr:
          requires:
            - build
