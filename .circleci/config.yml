version: 2.1

executors:
  builder:
    docker:
      - image: docker:stable

jobs:
  build:
    executor: builder
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - checkout
      - run:
          name: Build Image
          command: ./.circleci/bin/build
          environment:
            KONG_DATABASE: off
            KONG_DECLARATIVE_CONFIG: /usr/local/share/kong.yml
            KONG_ADMIN_LISTEN: 0.0.0.0:8001
            KONG_PROXY_LISTEN: 0.0.0.0:8000
            KONG_PLUGINS: bellatrix_bridge,cors,request-size-limiting,prometheus
            KONG_GO_PLUGINS_DIR: /usr/local/share/go-plugins
            KONG_PROXY_ACCESS_LOG: /dev/stdout
            KONG_PROXY_ERROR_LOG: /dev/stderr
            KONG_ADMIN_ACCESS_LOG: /dev/stdout
            KONG_ADMIN_ERROR_LOG: /dev/stderr
            KONG_LOG_LEVEL: info
            SSL_CERTIFICATE_1: 
            SSL_CERTIFICATE_2: 
            SSL_CERTIFICATE_PRIVATE_KEY: 
            SNI_NAME: api.staging.stord.com
      - run:
          name: Create Workspace
          command: mkdir -p workspace
      - run:
          name: Store Tagged Artifact In CircleCI Workspace
          command: docker save -o workspace/kong-tagged-artifact gcr.io/stord-nonprod/kong:${CIRCLE_WORKFLOW_ID}
      - persist_to_workspace:
          root: workspace
          paths:
            - kong-tagged-artifact

  push-to-gcr:
    executor: builder
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - attach_workspace:
          at: /tmp/workspace
      - checkout
      - run:
          name: Authenticate with GCR
          command: echo $NONPROD_GCLOUD_SERVICE_KEY | docker login -u _json_key --password-stdin https://gcr.io
      - run:
          name: Load Tagged Artifact from CircleCI Workspace
          command: docker load -i /tmp/workspace/kong-tagged-artifact
      - run:
          name: Push to GCR
          command: ./.circleci/bin/push-to-gcr

  promote:
    executor: builder
    steps:
      - setup_remote_docker:
          docker_layer_caching: false
      - checkout
      - run:
          name: Promote Backend
          command: ./.circleci/bin/promote <<pipeline.git.tag>>

workflows:
  version: 2
  build_and_release:
    jobs:
      - build
      - push-to-gcr:
          requires:
            - build
          # filters:
          #   branches:
          #     only: master
      - promote:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}/
