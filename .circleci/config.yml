version: 2.1

jobs:
  build:
    docker:
      - image: docker/compose:latest
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - checkout
      - run:
          name: Authenticate with GCR
          command: echo $NONPROD_GCLOUD_SERVICE_KEY | docker login -u _json_key --password-stdin https://gcr.io
      - run:
          name: Build Images
          command: docker-compose -f docker-compose.yml -f docker-compose.ci.yml build
      - run:
          name: Push Images
          command: docker-compose -f docker-compose.yml -f docker-compose.ci.yml push
  deploy-kong:
    docker:
      - image: docker:stable
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - checkout
      - run:
          name: Deploy
          command: ./.circleci/bin/deploy-kong
  # promote:
  #   steps:
  #     - setup_remote_docker:
  #         docker_layer_caching: false
  #     - run:
  #         name: Checkout
  #         command: checkout
  #     - run:
  #         name: Promote Backend
  #         command: ./.circleci/bin/promote <<pipeline.git.tag>>
workflows:
  version: 2
  build_and_release:
    jobs:
      - build
      - deploy-kong:
          filters:
            branches:
              only: master
