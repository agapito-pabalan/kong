version: 2.1

executors:
  builder:
    docker:
      - image: docker:stable

jobs:
  build:
    executor: builder
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - checkout
      - run:
          name: Build Image
          command: ./.circleci/bin/build
      - run:
          name: Create Workspace
          command: mkdir -p workspace
      - run:
          name: Store Tagged In CircleCI
          command: docker save -o workspace/kong-tagged gcr.io/stord-nonprod/kong:${CIRCLE_WORKFLOW_ID}
      - persist_to_workspace:
          root: workspace
          paths:
            - kong-tagged

  push-to-gcr:
    executor: builder
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - attach_workspace:
          at: /tmp/workspace
      - checkout
      - run:
          name: Authenticate with GCR
          command: echo $NONPROD_GCLOUD_SERVICE_KEY | docker login -u _json_key --password-stdin https://gcr.io
      - run:
          name: Load Tagged Image from CircleCI
          command: docker load -i /tmp/workspace/kong-tagged
      - run:
          name: Push to GCR
          command: ./.circleci/bin/push-to-gcr

  # promote:
  #   steps:
  #     - setup_remote_docker:
  #         docker_layer_caching: false
  #     - run:
  #         name: Checkout
  #         command: checkout
  #     - run:
  #         name: Promote Backend
  #         command: ./.circleci/bin/promote <<pipeline.git.tag>>
workflows:
  version: 2
  build_and_release:
    jobs:
      - build
      - push-to-gcr:
          requires:
            - build
