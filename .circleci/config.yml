version: 2.1

jobs:
  build:
    docker:
      - image: docker:stable
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - checkout
      - run:
          name: Build Image
          command: ./.circleci/bin/build
      - run:
          name: Store Tagged In CircleCI
          command: docker save -o /tmp/kong-tagged gcr.io/stord-nonprod/kong:${CIRCLE_WORKFLOW_ID}
  push-to-gcr:
    docker:
      - image: docker:stable
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - checkout
      - run:
          name: Authenticate with GCR
          command: echo $NONPROD_GCLOUD_SERVICE_KEY | docker login -u _json_key --password-stdin https://gcr.io
      - run:
          name: Load Latest Image from CircleCI
          command: docker load -i /tmp/kong-latest
      - run:
          name: Push to GCR
          command: ./.circleci/bin/push-to-gcr
