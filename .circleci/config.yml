version: 2.1

executors:
  builder:
    docker:
      - image: gcr.io/stord-nonprod/builder:latest
        auth:
          username: _json_key
          password: ${NONPROD_GCLOUD_SERVICE_KEY}

jobs:
  build-and-push-nonprod:
    executor: builder
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - checkout
      - run:
          name: Build Image  
          command: docker-compose -f docker-compose.nonprod.yml build
      - run:
          name: Authenticate with GCR
          command: echo $NONPROD_GCLOUD_SERVICE_KEY | docker login -u _json_key --password-stdin https://gcr.io
      - run:
          name: Push Image
          command: docker-compose -f docker-compose.nonprod.yml push

  build-and-push-prod:
    executor: builder
    steps:
      - setup_remote_docker:
          docker_layer_caching: false
      - checkout
      - run:
          name: Build Image  
          command: docker-compose -f docker-compose.prod.yml build
      - run:
          name: Authenticate with GCR
          command: echo $PROD_GCLOUD_SERVICE_KEY | docker login -u _json_key --password-stdin https://gcr.io
      - run:
          name: Push Image
          command: docker-compose -f docker-compose.prod.yml push

workflows:
  version: 2
  build_and_release:
    jobs:
      - build-and-push-nonprod:
          filters:
            branches:
              only: master
      - build-and-push-prod:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /[0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12}/
