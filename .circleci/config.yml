version: 2.1

executors:
  builder:
    docker:
      - image: gcr.io/stord-nonprod/builder:latest
        auth:
          username: _json_key
          password: ${NONPROD_GCLOUD_SERVICE_KEY}
    working_directory: /workspace

jobs:
  build-local:
    executor: builder
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - checkout
      - run:
          name: Build Image  
          command: docker-compose -f docker-compose.local.yml build
      - run: mkdir -p images
      - run: cp -p docker-compose.local.yml images
      - run:
          name: Save Image
          command: docker save -o images/kong-local.tar gcr.io/stord-nonprod/kong-local
      - persist_to_workspace:
          root: images
          paths:
            - kong-local.tar
            - docker-compose.local.yml

  build-nonprod:
    executor: builder
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - checkout
      - run:
          name: Build Image  
          command: docker-compose -f docker-compose.nonprod.yml build
      - run: mkdir -p images
      - run: cp -p docker-compose.nonprod.yml images
      - run:
          name: Save Image
          command: docker save -o images/kong-nonprod.tar gcr.io/stord-nonprod/kong
      - persist_to_workspace:
          root: images
          paths:
            - kong-nonprod.tar
            - docker-compose.nonprod.yml

  build-prod:
    executor: builder
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - checkout
      - run:
          name: Build Image  
          command: docker-compose -f docker-compose.prod.yml build
      - run: mkdir -p images
      - run: cp -p docker-compose.prod.yml images
      - run:
          name: Save Image
          command: docker save -o images/kong-prod.tar gcr.io/stord-production/kong
      - persist_to_workspace:
          root: images
          paths:
            - kong-prod.tar
            - docker-compose.prod.yml

  push-local:
    executor: builder
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - attach_workspace:
          at: images
      - run:
          name: Load Image
          command: docker load -i images/kong-local.tar
      - run:
          name: Authenticate with GCR
          command: echo $NONPROD_GCLOUD_SERVICE_KEY | docker login -u _json_key --password-stdin https://gcr.io
      - run:
          name: Push Image
          command: docker-compose -f images/docker-compose.local.yml push

  push-nonprod:
    executor: builder
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - attach_workspace:
          at: images
      - run:
          name: Load Image
          command: docker load -i images/kong-nonprod.tar
      - run:
          name: Authenticate with GCR
          command: echo $NONPROD_GCLOUD_SERVICE_KEY | docker login -u _json_key --password-stdin https://gcr.io
      - run:
          name: Push Image
          command: docker-compose -f images/docker-compose.nonprod.yml push

  push-prod:
    executor: builder
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - attach_workspace:
          at: images
      - run:
          name: Load Image
          command: docker load -i images/kong-prod.tar
      - run:
          name: Authenticate with GCR
          command: echo $PROD_GCLOUD_SERVICE_KEY | docker login -u _json_key --password-stdin https://gcr.io
      - run:
          name: Push Image
          command: docker-compose -f images/docker-compose.prod.yml push

workflows:
  version: 2
  build_and_release:
    jobs:
      - build-local
      - build-nonprod
      - build-prod
      - push-local:
          requires:
            - build-local
          filters:
            branches:
              only: master
      - push-nonprod:
          requires:
            - build-nonprod
          filters:
            branches:
              only: master
      - push-prod:
          requires:
            - build-prod
          filters:
            branches:
              only: master
