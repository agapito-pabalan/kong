      - name: mintaka_inventory_ledger_entries
        strip_path: false
        paths:
          - /inventory_ledger_entries/([^\/]+)
      - name: mintaka_inventory_ledger_entries_inventory_balance
        strip_path: false
        paths:
          - /inventory_ledger_entries/([^\/]+)/inventory_balance
      - name: mintaka_item_counts
        strip_path: false
        paths:
          - /item_counts
      - name: mintaka_item_counts_by_id
        strip_path: false
        paths:
          - /item_counts/([^\/]+)
      - name: mintaka_manual_adjustments
        strip_path: false
        paths:
          - /manual_adjustments
      - name: mintaka_manual_adjustments_by_id
        strip_path: false
        paths:
          - /manual_adjustments/([^\/]+)
      - name: mintaka_shipment_receipts_inventory_adjustment
        strip_path: false
        paths:
          - /shipment_receipts/([^\/]+)/inventory_adjustment
      - name: mintaka_shipments_inventory_adjustment
        strip_path: false
        paths:
          - /shipments/([^\/]+)/inventory_adjustment
      - name: mintaka_shipping_orders_inventory_adjustment
        strip_path: false
        paths:
          - /shipping_orders/([^\/]+)/inventory_adjustment
      - name: mintaka_trade_connections_inventory_advices
        strip_path: false
        paths:
          - /trade_connections/([^\/]+)/inventory_advices
      - name: mintaka_trade_connections_manual_adjustments
        strip_path: false
        paths:
          - /trade_connections/([^\/]+)/manual_adjustments
      - name: mintaka_warehouses_items
        strip_path: false
        paths:
          - /warehouses/([^\/]+)/items
  - name: meissa
    url: http://meissa
    routes:
      - name: meissa_root
        strip_path: false
        paths:
          - /v1/documents
  - name: legacy_auth
    protocol: http
    host: rigel.default.svc.cluster.local
    routes:
      - name: auth
        strip_path: true
        paths:
          - /auth
  - name: acme_dummy
    host: 10.4.15.145
    routes:
      - name: LetsEncrypt_ACME_Challenge
        strip_path: false
        paths:
          - /.well-known/acme-challenge
plugins:
  - name: cors
    config:
      origins:
        - "*"
  - name: bellatrix_bridge
    config:
      bellatrixendpoint: http://bellatrix/v1/jwt/permissions
  - name: request-size-limiting
    config:
      allowed_payload_size: 128
      size_unit: megabytes
  - name: prometheus
certificates:
  - cert: |
      -----BEGIN CERTIFICATE-----
      SSL_CERTIFICATE_1
      -----END CERTIFICATE-----
      -----BEGIN CERTIFICATE-----
      SSL_CERTIFICATE_2
      -----END CERTIFICATE-----
    key: |
      -----BEGIN PRIVATE KEY-----
      SSL_CERTIFICATE_PRIVATE_KEY
      -----END PRIVATE KEY-----
    snis:
      - name: SNI_NAME