      - name: saiph_countries
        strip_path: false
        paths:
          - /countries
      - name: saiph_countries_subdivisions
        strip_path: false
        paths:
          - /countries/([^\/]+)/subdivisions
      - name: saiph_distribution_networks
        strip_path: false
        paths:
          - /distribution_networks
      - name: saiph_distribution_networks_items
        strip_path: false
        paths:
          - /distribution_networks/([^\/]+)/items
      - name: saiph_distribution_networks_items_search
        strip_path: false
