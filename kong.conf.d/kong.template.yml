# _format_version: "1.1"
plugins:
  - name: cors
    config:
      origins:
        - https://admin.staging.stord.com
        - https://shipper.staging.stord.com
        - https://warehouse.staging.stord.com
        - https://admin.stord.com
        - https://shipper.stord.com
        - https://warehouse.stord.com
        - https://*.review.stord.com
        - https://admin-cf.staging.stord.com
        - https://*.admin-client-nonprod.pages.dev
        - https://cloud.stord.com
        - https://cloud.staging.stord.com
  - name: user_management_bridge
    config:
      user_management_endpoint: http://user-management/v1/jwt/permissions
      auth0_url: AUTH0_JWKS_URL
      cache_url: REDIS_CACHE_URL
      jwks_refresh_interval: 15
  - name: request-size-limiting
    config:
      allowed_payload_size: 128
      size_unit: megabytes
  - name: prometheus
  - name: correlation-id
    config:
      header_name: x-request-id
      generator: uuid
      echo_downstream: true
