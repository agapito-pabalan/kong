          - /v1/users/([^\/]+)/roles
      - name: bellatrix_v1_utils_headers
        strip_path: false
        paths:
          - /v1/utils/headers
  - name: mintaka
    url: http://mintaka
    routes:
      - name: mintaka_cancellations_inventory_adjustment
        strip_path: false
        paths:
