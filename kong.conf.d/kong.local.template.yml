# _format_version: "1.1"
plugins:
  - name: cors
    config:
      origins:
        - "*"
  - name: request-size-limiting
    config:
      allowed_payload_size: 128
      size_unit: megabytes
  - name: bellatrix_bridge
    config:
      bellatrix_endpoint: http://bellatrix:4003/v1/jwt/permissions
      auth0_url: https://stord-staging.auth0.com/.well-known/jwks.json
      cache_url: "redis://cache:6379"
      jwks_refresh_interval: 15
  - name: prometheus
