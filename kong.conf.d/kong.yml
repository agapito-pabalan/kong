        strip_path: false
        paths:
          - /distribution_networks
      - name: saiph_distribution_networks_items
        strip_path: false
        paths:
          - /distribution_networks/([^\/]+)/items
        regex_priority: 0
      - name: saiph_distribution_networks_items_search
        strip_path: false
        paths:
          - /distribution_networks/([^\/]+)/items_search
        regex_priority: 1
      - name: saiph_health
        strip_path: false
        paths:
          - /health/saiph
      - name: saiph_item_unit_conversions
        strip_path: false
        paths:
          - /item_unit_conversions
      - name: saiph_items
        strip_path: false
        paths:
          - /items$
          - /items/([^\/]+)$
      - name: saiph_items_item_unit_conversions
        strip_path: false
        paths:
          - /items/([^\/]+)/item_unit_conversions
      - name: saiph_items_lookup
        strip_path: false
        paths:
          - /items_lookup
      - name: saiph_trade_connections
        strip_path: false
        paths:
          - /trade_connections
      - name: saiph_warehouses
        strip_path: false
        paths:
          - /warehouses(|\?[^\/]+)$
        regex_priority: 0
      - name: saiph_warehouse
        strip_path: false
        paths:
          - /warehouses/([^\/]+)$
        regex_priority: 1
      - name: saiph_warehouse_distribution_networks
        strip_path: false
        paths:
