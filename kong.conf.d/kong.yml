_format_version: "1.1"

plugins:
  - name: correlation-id
    config:
      header_name: x-request-id
      generator: uuid
      echo_downstream: true
  - name: cors
    config:
      origins:
        - '^https:\/\/.*\.stord\.com$'
        - '^https:\/\/.*\.stord-.*\.pages\.dev$'
        - '^https:\/\/.*\.stord.dev$'
  - name: auth
    config:
      cloud_endpoint: $CLOUD_SERVICE_URL/v1/auth/token
      cloud_signature_key: $CLOUD_SIGNATURE_KEY
      ld_sdk_key: $LD_SDK_KEY
      auth0_url: $AUTH0_JWKS_URL
      cache_url: $REDIS_CACHE_URL
      jwks_refresh_interval: 15
  - name: request-size-limiting
    config:
      allowed_payload_size: 128
      size_unit: megabytes
  - name: opentelemetry
    config:
      endpoint: $OTEL_COLLECTOR_ENDPOINT
      propagation:
        extract: [w3c, datadog, gcp, b3, jaeger, aws, ot]
        inject: [w3c]
        default_format: w3c
      resource_attributes:
        # This plugin does not accept the standard `OTEL_RESOURCE_ATTRIBUTES`
        # environment variable, so we recreate the stord-application list here.
        deployment.environment: "$OTEL_RESOURCE_ATTRIBUTE_DEPLOYMENT_ENVIRONMENT"
        git.commit.sha: "$OTEL_RESOURCE_ATTRIBUTE_GIT_COMMIT_SHA"
        git.repository_url: "$OTEL_RESOURCE_ATTRIBUTE_GIT_REPOSITORY_URL"
        k8s.container.name: "$OTEL_RESOURCE_ATTRIBUTE_K8S_CONTAINER_NAME"
        k8s.pod.ip: "$OTEL_RESOURCE_ATTRIBUTE_K8S_POD_IP"
        k8s.pod.uid: "$OTEL_RESOURCE_ATTRIBUTE_K8S_POD_UID"
        service.name: "$OTEL_RESOURCE_ATTRIBUTE_SERVICE_NAME"
        service.version: "$OTEL_RESOURCE_ATTRIBUTE_SERVICE_VERSION"
